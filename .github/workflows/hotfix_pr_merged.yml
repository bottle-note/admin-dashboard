name: hotfix PR deployment

# 핫픽스 릴리즈 전용 게이트. hotfixes/** 네임스페이스는 과거 릴리즈 브랜치의 워크플로 스냅샷이
# 필터하지 않으므로 표준 게이트(release_pr_merged.yml)와 나란히 실행되지 않는다.
on:
  pull_request_target:
    types: [closed]
    branches:
      - 'hotfixes/**'

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  verify-merged-hotfix-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-key: ${{ steps.release.outputs.release-key }}
      source-sha: ${{ steps.release.outputs.source-sha }}
      candidate-sha: ${{ steps.release.outputs.candidate-sha }}
      base-source-sha: ${{ steps.release.outputs.base-source-sha }}
      release-branch: ${{ steps.release.outputs.release-branch }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: verify hotfix PR
        id: release
        shell: bash
        run: |
          set -euo pipefail

          [[ "$PR_BASE_REF" =~ ^hotfixes/([0-9]{4}-[0-9]{2}-[0-9]{2})/([1-9][0-9]*)$ ]] || {
            echo "::error::base ref is not a hotfix release ref: $PR_BASE_REF"
            exit 1
          }
          release_date="${BASH_REMATCH[1]}"
          sequence="${BASH_REMATCH[2]}"
          release_key="${release_date}/${sequence}"

          # >>> common PR metadata verification (keep byte-identical between release_pr_merged.yml and hotfix_pr_merged.yml)
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::release PR number is invalid: $PR_NUMBER"
            exit 1
          }
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$PR_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::release PR contains an invalid commit SHA"
            exit 1
          }

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          PR_JSON="$pr_json" EXPECTED_NUMBER="$PR_NUMBER" EXPECTED_BASE="$PR_BASE_REF" EXPECTED_HEAD="$PR_HEAD_REF" \
            EXPECTED_HEAD_SHA="$PR_HEAD_SHA" EXPECTED_BASE_SHA="$PR_BASE_SHA" EXPECTED_MERGE_SHA="$PR_MERGE_SHA" \
            REPOSITORY="$REPOSITORY" python3 - <<'PY'
          import json
          import os
          import sys

          pr = json.loads(os.environ['PR_JSON'])
          head = pr.get('head') or {}
          base = pr.get('base') or {}
          errors = []
          if (head.get('repo') or {}).get('full_name') != os.environ['REPOSITORY']:
              errors.append('PR head repository is not this repository')
          if (base.get('repo') or {}).get('full_name') != os.environ['REPOSITORY']:
              errors.append('PR base repository is not this repository')
          if pr.get('number') != int(os.environ['EXPECTED_NUMBER']):
              errors.append('PR number differs from the event')
          if not pr.get('merged'):
              errors.append('PR is not merged')
          if head.get('ref') != os.environ['EXPECTED_HEAD'] or head.get('sha') != os.environ['EXPECTED_HEAD_SHA']:
              errors.append('PR head differs from the event')
          if base.get('ref') != os.environ['EXPECTED_BASE'] or base.get('sha') != os.environ['EXPECTED_BASE_SHA']:
              errors.append('PR base differs from the event')
          if pr.get('merge_commit_sha') != os.environ['EXPECTED_MERGE_SHA']:
              errors.append('PR merge SHA differs from the event')

          if errors:
              for error in errors:
                  print(f'::error::{error}', file=sys.stderr)
              sys.exit(1)
          PY
          # <<< common PR metadata verification

          release_values="$(PR_JSON="$pr_json" EXPECTED_KEY="$release_key" python3 - <<'PY'
          import json
          import os
          import re
          import sys

          body = (json.loads(os.environ['PR_JSON']).get('body') or '')

          def one(name, pattern):
              values = re.findall(rf'<!--\s*{name}:\s*({pattern})\s*-->', body)
              if len(values) != 1:
                  print(f'::error::hotfix PR body {name} marker is missing or invalid', file=sys.stderr)
                  sys.exit(1)
              return values[0]

          candidate_sha = one('release-source-sha', r'[0-9a-f]{40}')
          key = one('release-key', r'[0-9]{4}-[0-9]{2}-[0-9]{2}/[1-9][0-9]*')
          service = one('release-service', r'dashboard')
          release_type = one('release-type', r'hotfix')
          base_key = one('release-base-key', r'[0-9]{4}-[0-9]{2}-[0-9]{2}/[1-9][0-9]*')
          base_source_sha = one('release-base-source-sha', r'[0-9a-f]{40}')

          if key != os.environ['EXPECTED_KEY'] or service != 'dashboard' or release_type != 'hotfix':
              print('::error::hotfix PR body markers do not match the release target', file=sys.stderr)
              sys.exit(1)
          if base_key == key:
              print('::error::hotfix base release key must differ from the hotfix release key', file=sys.stderr)
              sys.exit(1)

          print(candidate_sha)
          print(base_key)
          print(base_source_sha)
          PY
          )"
          mapfile -t release_fields <<< "$release_values"
          candidate_sha="${release_fields[0]}"
          base_key="${release_fields[1]}"
          base_source_sha="${release_fields[2]}"

          PR_JSON="$pr_json" python3 - <<'PY'
          import json
          import os
          import sys

          pr = json.loads(os.environ['PR_JSON'])
          head = pr.get('head') or {}
          errors = []
          if not (head.get('ref') or '').startswith('hotfix/'):
              errors.append('hotfix release PR head must match hotfix/**')
          if not isinstance(pr.get('changed_files'), int) or pr['changed_files'] < 1:
              errors.append('hotfix release PR must contain reviewed file changes')

          if errors:
              for error in errors:
                  print(f'::error::{error}', file=sys.stderr)
              sys.exit(1)
          PY

          [[ "$candidate_sha" == "$PR_HEAD_SHA" ]] || {
            echo "::error::release source marker must equal the reviewed PR head SHA"
            exit 1
          }
          [[ "$base_source_sha" == "$PR_BASE_SHA" ]] || {
            echo "::error::hotfix branch does not point to the declared production source"
            exit 1
          }

          git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA" "$PR_MERGE_SHA"
          merge_tree="$(git show -s --format=%T "$PR_MERGE_SHA")"

          # 직전 운영 배포는 표준(release_pr_merged.yml) 또는 핫픽스(이 파일) run 중 가장 최근 성공 run 이다.
          release_runs_file="${RUNNER_TEMP}/dashboard-successful-release-runs.json"
          hotfix_runs_file="${RUNNER_TEMP}/dashboard-successful-hotfix-runs.json"
          latest_run_file="${RUNNER_TEMP}/dashboard-latest-successful-release-run.json"
          jobs_file="${RUNNER_TEMP}/dashboard-release-run-jobs.json"
          closed_prs_file="${RUNNER_TEMP}/dashboard-closed-release-prs.json"
          gh api --paginate --slurp -X GET \
            "repos/${REPOSITORY}/actions/workflows/release_pr_merged.yml/runs" \
            -f status=success -f per_page=100 > "$release_runs_file"
          gh api --paginate --slurp -X GET \
            "repos/${REPOSITORY}/actions/workflows/hotfix_pr_merged.yml/runs" \
            -f status=success -f per_page=100 > "$hotfix_runs_file"
          selected_run_id=""
          while read -r candidate_run_id candidate_verify_job; do
            gh api --paginate --slurp -X GET \
              "repos/${REPOSITORY}/actions/runs/${candidate_run_id}/jobs" \
              -f per_page=100 > "$jobs_file"
            if JOBS_FILE="$jobs_file" VERIFY_JOB="$candidate_verify_job" python3 - <<'PY'
          import json
          import os
          import sys

          with open(os.environ['JOBS_FILE'], encoding='utf-8') as file:
              pages = json.load(file)
          jobs = [job for page in pages for job in (page.get('jobs') or [])]
          conclusions = {job.get('name'): job.get('conclusion') for job in jobs}
          required = {
              os.environ['VERIFY_JOB'],
              'deploy-release-applications / gate dashboard release',
              'deploy-release-applications / build and push dashboard image',
              'deploy-release-applications / hand off dashboard image to image updater',
              'delete-release-branch',
          }
          sys.exit(0 if all(conclusions.get(name) == 'success' for name in required) else 1)
          PY
            then
              selected_run_id="$candidate_run_id"
              break
            fi
          done < <(RELEASE_RUNS_FILE="$release_runs_file" HOTFIX_RUNS_FILE="$hotfix_runs_file" python3 - <<'PY'
          import json
          import os

          verify_jobs = {
              '.github/workflows/release_pr_merged.yml': 'verify-merged-release-pr',
              '.github/workflows/hotfix_pr_merged.yml': 'verify-merged-hotfix-pr',
          }
          runs = []
          for runs_file in (os.environ['RELEASE_RUNS_FILE'], os.environ['HOTFIX_RUNS_FILE']):
              with open(runs_file, encoding='utf-8') as file:
                  pages = json.load(file)
              for page in pages:
                  for run in page.get('workflow_runs') or []:
                      if run.get('event') in {'pull_request', 'pull_request_target'} and run.get('path') in verify_jobs:
                          runs.append(run)
          runs.sort(key=lambda run: run['created_at'], reverse=True)
          for run in runs:
              print(run['id'], verify_jobs[run['path']])
          PY
          )
          [[ -n "$selected_run_id" ]] || {
            echo "::error::no successful dashboard release deployment run was found"
            exit 1
          }
          gh api -X GET "repos/${REPOSITORY}/actions/runs/${selected_run_id}" > "$latest_run_file"
          gh api --paginate --slurp -X GET "repos/${REPOSITORY}/pulls" \
            -f state=closed -f per_page=100 > "$closed_prs_file"
          LATEST_RUN_FILE="$latest_run_file" CLOSED_PRS_FILE="$closed_prs_file" \
            EXPECTED_KEY="$base_key" EXPECTED_SOURCE="$base_source_sha" python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import sys

          with open(os.environ['LATEST_RUN_FILE'], encoding='utf-8') as file:
              run = json.load(file)
          with open(os.environ['CLOSED_PRS_FILE'], encoding='utf-8') as file:
              pages = json.load(file)
          pulls = [pr for page in pages for pr in page]
          run_time = dt.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
          candidates = []
          for pr in pulls:
              merged_at = pr.get('merged_at')
              base_ref = ((pr.get('base') or {}).get('ref') or '')
              head_sha = ((pr.get('head') or {}).get('sha') or '')
              if not merged_at or not base_ref.startswith(('releases/', 'hotfixes/')) or head_sha != run.get('head_sha'):
                  continue
              merged_time = dt.datetime.fromisoformat(merged_at.replace('Z', '+00:00'))
              age = (run_time - merged_time).total_seconds()
              if 0 <= age <= 900:
                  candidates.append((merged_time, pr))
          candidates.sort(key=lambda item: item[0], reverse=True)
          if not candidates:
              print('::error::latest successful release run cannot be bound to its merged release PR', file=sys.stderr)
              sys.exit(1)

          pr = candidates[0][1]
          body = pr.get('body') or ''
          sources = re.findall(r'<!--\s*release-source-sha:\s*([0-9a-f]{40})\s*-->', body)
          keys = re.findall(r'<!--\s*release-key:\s*([0-9]{4}-[0-9]{2}-[0-9]{2}/[1-9][0-9]*)\s*-->', body)
          services = re.findall(r'<!--\s*release-service:\s*(dashboard)\s*-->', body)
          hotfix_types = re.findall(r'<!--\s*release-type:\s*(hotfix)\s*-->', body)
          if len(sources) != 1 or len(keys) != 1 or services != ['dashboard']:
              print('::error::latest successful release PR markers are invalid', file=sys.stderr)
              sys.exit(1)
          deployed_source = pr.get('merge_commit_sha') if hotfix_types == ['hotfix'] else sources[0]
          if keys[0] != os.environ['EXPECTED_KEY'] or deployed_source != os.environ['EXPECTED_SOURCE']:
              print('::error::hotfix base is not the latest successful release deployment source', file=sys.stderr)
              sys.exit(1)
          PY

          successful_candidate_ci="$(gh api "repos/${REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "ci" and .status == "completed" and .conclusion == "success")] | length')"
          [[ "$successful_candidate_ci" -ge 1 ]] || {
            echo "::error::hotfix candidate has no successful ci check"
            exit 1
          }

          read -r merge_sha first_parent second_parent extra_parent <<< "$(git rev-list --parents -n 1 "$PR_MERGE_SHA")"
          [[ "$merge_sha" == "$PR_MERGE_SHA" && "$first_parent" == "$PR_BASE_SHA" && \
             "$second_parent" == "$PR_HEAD_SHA" && -z "${extra_parent:-}" ]] || {
            echo "::error::hotfix release must use a two-parent merge commit with base and reviewed head"
            exit 1
          }
          expected_merge_tree="$(git merge-tree --write-tree "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          [[ "$merge_tree" == "$expected_merge_tree" ]] || {
            echo "::error::hotfix merge tree differs from the deterministic base-plus-candidate merge"
            exit 1
          }
          source_sha="$PR_MERGE_SHA"

          {
            echo "release-key=${release_key}"
            echo "source-sha=${source_sha}"
            echo "candidate-sha=${candidate_sha}"
            echo "base-source-sha=${base_source_sha}"
            echo "release-branch=${PR_BASE_REF}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Admin Dashboard hotfix PR verified"
            echo "- Release key: \`${release_key}\`"
            echo "- Release type: \`hotfix\`"
            echo "- Candidate SHA: \`${candidate_sha}\`"
            echo "- Deployment SHA: \`${source_sha}\`"
            echo "- Base release: \`${base_key}\` at \`${base_source_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-release-applications:
    needs: verify-merged-hotfix-pr
    uses: ./.github/workflows/deploy_release_applications.yml
    with:
      source_sha: ${{ needs.verify-merged-hotfix-pr.outputs.source-sha }}
      release_key: ${{ needs.verify-merged-hotfix-pr.outputs.release-key }}
      release_type: hotfix
      candidate_sha: ${{ needs.verify-merged-hotfix-pr.outputs.candidate-sha }}
      base_source_sha: ${{ needs.verify-merged-hotfix-pr.outputs.base-source-sha }}
    secrets: inherit

  delete-release-branch:
    needs:
      - verify-merged-hotfix-pr
      - deploy-release-applications
    runs-on: ubuntu-latest
    steps:
      - name: delete one-time hotfix release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ needs.verify-merged-hotfix-pr.outputs.release-branch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_BRANCH" == hotfixes/* ]] || {
            echo "::error::refusing to delete a non-hotfix branch: ${RELEASE_BRANCH}"
            exit 1
          }
          encoded_branch="$(RELEASE_BRANCH="$RELEASE_BRANCH" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RELEASE_BRANCH"], safe=""))')"
          gh api -X DELETE "repos/${REPOSITORY}/git/refs/heads/${encoded_branch}"
          echo "[hotfix-pr] deleted release_branch=${RELEASE_BRANCH}"
