name: deploy admin dashboard preview

on:
  pull_request_target:
    branches: [main]
    types: [labeled, synchronize, reopened]

concurrency:
  group: admin-dashboard-preview-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: bottlenote-admin-dashboard-preview
  PREVIEW_LABEL: preview-deploy
  PREVIEW_CHANNEL_TAG: dashboard_latest_preview

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview-deploy') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview-deploy')
    runs-on: ubuntu-24.04-arm
    outputs:
      image-digest: ${{ steps.build.outputs.image-digest }}
      image-tag: ${{ steps.version.outputs.image-tag }}
    steps:
      - name: transfer preview ownership from other open pull requests
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const currentPullNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const pullRequests = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 });
            for (const pullRequest of pullRequests) {
              if (pullRequest.number === currentPullNumber || !pullRequest.labels.some(({ name }) => name === process.env.PREVIEW_LABEL)) continue;
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pullRequest.number, name: process.env.PREVIEW_LABEL });
              await github.rest.issues.createComment({ owner, repo, issue_number: pullRequest.number, body: `Preview deployment ownership transferred to #${currentPullNumber}. Tracking: bottle-note/workspace#488.` });
            }

      - name: checkout trusted signing material
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: .trusted
          submodules: recursive
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          persist-credentials: false

      - name: checkout pull request source without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .source
          submodules: false
          persist-credentials: false

      - name: set immutable preview image tag
        id: version
        env:
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          printf 'image-tag=dashboard_preview_pr-%s_%s\n' "$PULL_NUMBER" "${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: build, sign, and verify immutable preview image
        id: build
        uses: bottle-note/admin-dashboard/.github/actions/docker-build-push@06e07b84433fa3d8702993a030086886793879f1
        with:
          registry-url: ${{ secrets.REGISTRY_ADDRESS }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: ${{ steps.version.outputs.image-tag }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          source-ref: refs/pull/${{ github.event.pull_request.number }}/head
          dockerfile: .source/Dockerfile.preview
          context: .source
          platforms: linux/arm64
          cache-scope: dashboard-preview
          cache-export: 'true'
          image-title: BottleNote Admin Dashboard (Preview)
          image-description: Pull request preview build
          image-vendor: BottleNote
          image-authors: BottleNote Team
          build-args: |
            ADMIN_API_UPSTREAM=http://admin-api
          sign-image: 'true'
          cosign-key-path: .trusted/git.environment-variables/storage/docker-registry/cosign.key
          cosign-public-key-path: .trusted/git.environment-variables/storage/docker-registry/cosign.pub
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

  promote-preview-channel:
    name: promote current preview owner
    needs: build-preview
    runs-on: ubuntu-latest
    steps:
      - name: verify live preview ownership
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pull } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: context.payload.pull_request.number });
            const ownsPreview = pull.state === 'open' && pull.labels.some(({ name }) => name === process.env.PREVIEW_LABEL);
            if (!ownsPreview) core.setFailed('This pull request no longer owns the preview-deploy label.');

      - name: checkout trusted public signing key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: .trusted
          submodules: recursive
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          persist-credentials: false

      - name: login to private registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ secrets.REGISTRY_ADDRESS }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: setup docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.2.4

      - name: re-confirm preview ownership immediately before promotion
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (!pr.labels.some((label) => label.name === 'preview-deploy')) {
              core.setFailed('Preview ownership changed before channel promotion.');
            }

      - name: promote verified digest to preview channel
        env:
          IMAGE: ${{ secrets.REGISTRY_ADDRESS }}/${{ env.IMAGE_NAME }}
          EXPECTED_DIGEST: ${{ needs.build-preview.outputs.image-digest }}
          IMAGE_TAG: ${{ needs.build-preview.outputs.image-tag }}
          PUBLIC_KEY: ${{ github.workspace }}/.trusted/git.environment-variables/storage/docker-registry/cosign.pub
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::invalid image digest'; exit 1; }
          [[ "$IMAGE_TAG" =~ ^dashboard_preview_pr-[0-9]+_[0-9a-f]{7}$ ]] || { echo '::error::invalid immutable image tag'; exit 1; }
          cosign verify --key "$PUBLIC_KEY" --insecure-ignore-tlog "${IMAGE}@${EXPECTED_DIGEST}" >/dev/null
          docker buildx imagetools create --tag "${IMAGE}:${PREVIEW_CHANNEL_TAG}" "${IMAGE}@${EXPECTED_DIGEST}"
          channel_digest="$(docker buildx imagetools inspect "${IMAGE}:${PREVIEW_CHANNEL_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$channel_digest" == "$EXPECTED_DIGEST" ]] || { echo '::error::preview channel digest verification failed'; exit 1; }
          {
            echo '## Admin dashboard preview handoff'
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Channel: \`${PREVIEW_CHANNEL_TAG}\`"
            echo "- Digest: \`${EXPECTED_DIGEST}\`"
            echo '- Signature and channel digest verification: `passed`'
          } >> "$GITHUB_STEP_SUMMARY"
