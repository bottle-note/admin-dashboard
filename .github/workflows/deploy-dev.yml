name: deploy admin dashboard (development)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ci planet scale"]
    types: [completed]
    branches: [main]

concurrency:
  group: "deploy-admin-dashboard-dev"
  cancel-in-progress: true

env:
  IMAGE_NAME: bottlenote-admin-dashboard

jobs:
  build-development:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04-arm
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-tag: ${{ steps.version.outputs.image-tag }}
      image-digest: ${{ steps.build.outputs.image-digest }}
    steps:
      - name: checkout code with submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: true
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: set image tag
        id: version
        run: |
          SHORT_SHA="${SOURCE_SHA::7}"
          echo "version=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image-tag=dashboard_dev_${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: build and push to registry
        id: build
        uses: ./.github/actions/docker-build-push
        with:
          registry-url: ${{ secrets.REGISTRY_ADDRESS }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: ${{ steps.version.outputs.image-tag }}
          promote-tags: dashboard_latest_development
          source-sha: ${{ env.SOURCE_SHA }}
          source-ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          dockerfile: Dockerfile
          context: .
          platforms: linux/arm64
          cache-scope: dashboard-dev
          cache-export: 'true'
          image-title: "BottleNote Admin Dashboard (Development)"
          image-description: "BottleNote Admin Dashboard Frontend"
          image-vendor: "BottleNote"
          image-authors: "BottleNote Team"
          build-args: |
            ENV_FILE=git.environment-variables/application.vite/dev.sops.env
          build-secrets: |
            age_key=${{ secrets.SOPS_AGE_SECRET_KEY }}
          sign-image: 'true'
          cosign-key-path: 'git.environment-variables/storage/docker-registry/cosign.key'
          cosign-public-key-path: 'git.environment-variables/storage/docker-registry/cosign.pub'
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
