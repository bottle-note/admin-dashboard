name: deploy dashboard release applications

on:
  release:
    types:
      - published
  workflow_call:
    inputs:
      source_sha:
        description: Fixed main source SHA to deploy
        required: true
        type: string
      release_key:
        description: Release key in YYYY-MM-DD/N format
        required: true
        type: string
      release_type:
        description: Release PR type (standard or hotfix)
        required: false
        default: standard
        type: string
      candidate_sha:
        description: Reviewed PR head SHA
        required: false
        default: ''
        type: string
      base_source_sha:
        description: Previously deployed Release PR source for a hotfix
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-dashboard-production-${{ github.event.release.tag_name || inputs.release_key }}
  cancel-in-progress: false

env:
  IMAGE_NAME: bottlenote-admin-dashboard

jobs:
  release-gate:
    name: gate dashboard release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-tag: ${{ steps.release.outputs.release-tag }}
      release-key: ${{ steps.release.outputs.release-key }}
      image-tag: ${{ steps.release.outputs.image-tag }}
      source-sha: ${{ steps.release.outputs.source-sha }}
      deployment-source: ${{ steps.release.outputs.deployment-source }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: validate dashboard release
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
          RELEASE_KEY_INPUT: ${{ inputs.release_key }}
          RELEASE_TYPE_INPUT: ${{ inputs.release_type }}
          CANDIDATE_SHA_INPUT: ${{ inputs.candidate_sha }}
          BASE_SOURCE_SHA_INPUT: ${{ inputs.base_source_sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            [[ "$RELEASE_TAG" =~ ^dashboard/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::dashboard release tag required, got: $RELEASE_TAG"
              exit 1
            }
            version="${RELEASE_TAG#dashboard/v}"
            release_key="$version"
            image_tag="dashboard_${version}"
            deployment_source="github-release"

            git fetch --tags origin
            git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null || {
              echo "::error::release tag not found: $RELEASE_TAG"
              exit 1
            }
            source_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            git merge-base --is-ancestor "$source_sha" origin/main || {
              echo "::error::tag commit is not contained in origin/main: $source_sha"
              exit 1
            }

            RELEASE_TAG="$RELEASE_TAG" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" python3 - <<'PY'
          import json
          import os
          import sys

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as event_file:
              release = json.load(event_file).get('release') or {}
          if release.get('tag_name') != os.environ['RELEASE_TAG']:
              print('::error::release payload tag mismatch', file=sys.stderr)
              sys.exit(1)
          if release.get('draft') or release.get('prerelease'):
              print('::error::release must be a published production release', file=sys.stderr)
              sys.exit(1)
          if len((release.get('body') or '').strip()) < 80:
              print('::error::release changelog is empty or too short', file=sys.stderr)
              sys.exit(1)
          PY
          else
            [[ "$SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::source_sha must be a full commit SHA"
              exit 1
            }
            [[ "$RELEASE_KEY_INPUT" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})/([1-9][0-9]*)$ ]] || {
              echo "::error::release_key must use YYYY-MM-DD/N format"
              exit 1
            }
            release_date="${BASH_REMATCH[1]}"
            sequence="${BASH_REMATCH[2]}"
            normalized_date="$(date -u -d "$release_date" +%F)" || {
              echo "::error::release_key contains an invalid calendar date"
              exit 1
            }
            [[ "$normalized_date" == "$release_date" ]] || {
              echo "::error::release_key contains an invalid calendar date"
              exit 1
            }

            source_sha="$SOURCE_SHA_INPUT"
            release_key="$RELEASE_KEY_INPUT"
            release_type="${RELEASE_TYPE_INPUT:-standard}"
            image_version="${release_date//-/.}.${sequence}"
            image_tag="dashboard_${image_version}"
            deployment_source="release-pr"
            RELEASE_TAG=""

            git cat-file -e "${source_sha}^{commit}"
            case "$release_type" in
              standard)
                [[ -z "$BASE_SOURCE_SHA_INPUT" ]] || {
                  echo "::error::standard release must not provide base_source_sha"
                  exit 1
                }
                git merge-base --is-ancestor "$source_sha" origin/main || {
                  echo "::error::standard source_sha is not contained in origin/main: $source_sha"
                  exit 1
                }
                ;;
              hotfix)
                [[ "$CANDIDATE_SHA_INPUT" =~ ^[0-9a-f]{40}$ && "$BASE_SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || {
                  echo "::error::hotfix release requires candidate_sha and base_source_sha"
                  exit 1
                }
                git cat-file -e "${CANDIDATE_SHA_INPUT}^{commit}"
                git cat-file -e "${BASE_SOURCE_SHA_INPUT}^{commit}"
                read -r merge_sha first_parent second_parent extra_parent <<< "$(git rev-list --parents -n 1 "$source_sha")"
                [[ "$merge_sha" == "$source_sha" && "$first_parent" == "$BASE_SOURCE_SHA_INPUT" && \
                   "$second_parent" == "$CANDIDATE_SHA_INPUT" && -z "${extra_parent:-}" ]] || {
                  echo "::error::hotfix deployment source is not the verified base-plus-candidate merge"
                  exit 1
                }
                ;;
              *)
                echo "::error::release_type must be standard or hotfix"
                exit 1
                ;;
            esac
          fi

          {
            echo "release-tag=$RELEASE_TAG"
            echo "release-key=$release_key"
            echo "image-tag=$image_tag"
            echo "source-sha=$source_sha"
            echo "deployment-source=$deployment_source"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Dashboard production release gate"
            echo "- Release key: \`${release_key}\`"
            echo "- Source: \`${deployment_source}\`"
            [[ "$deployment_source" != "release-pr" ]] || echo "- Release type: \`${release_type}\`"
            echo "- Image tag: \`${image_tag}\`"
            echo "- Source SHA: \`${source_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-dashboard-image:
    name: build and push dashboard image
    needs: release-gate
    runs-on: ubuntu-24.04-arm
    outputs:
      image-digest: ${{ steps.build.outputs.image-digest }}
    steps:
      - name: checkout release source with submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-gate.outputs.source-sha }}
          submodules: true
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: build and push docker image
        id: build
        uses: ./.github/actions/docker-build-push
        with:
          registry-url: ${{ secrets.REGISTRY_ADDRESS }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: ${{ needs.release-gate.outputs.image-tag }}
          additional-tags: ${{ needs.release-gate.outputs.deployment-source == 'release-pr' && 'dashboard_latest_production' || '' }}
          dockerfile: Dockerfile
          context: .
          platforms: linux/arm64
          cache-scope: dashboard-prod
          image-title: "BottleNote Admin Dashboard"
          image-description: "BottleNote Admin Dashboard Frontend"
          image-vendor: "BottleNote"
          image-authors: "BottleNote Team"
          build-args: |
            ENV_FILE=git.environment-variables/application.vite/prod.sops.env
          build-secrets: |
            age_key=${{ secrets.SOPS_AGE_SECRET_KEY }}
          sign-image: 'true'
          cosign-key-path: 'git.environment-variables/storage/docker-registry/cosign.key'
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

  handoff-to-image-updater:
    name: hand off dashboard image to image updater
    if: needs.release-gate.outputs.deployment-source == 'release-pr'
    needs:
      - release-gate
      - build-dashboard-image
    runs-on: ubuntu-latest
    steps:
      - name: summarize image updater handoff
        run: |
          {
            echo "## Dashboard image updater handoff"
            echo "- Channel: \`dashboard_latest_production\`"
            echo "- Digest: \`${{ needs.build-dashboard-image.outputs.image-digest }}\`"
            echo "- GitOps update: \`Argo CD Image Updater\`"
          } >> "$GITHUB_STEP_SUMMARY"

  update-production:
    name: update dashboard production image
    if: github.event_name == 'release'
    needs:
      - release-gate
      - build-dashboard-image
    runs-on: ubuntu-latest
    steps:
      - name: checkout code with submodules
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: setup kustomize
        uses: imranismail/setup-kustomize@v3

      - name: update production image tag
        env:
          REGISTRY: ${{ secrets.REGISTRY_ADDRESS }}
          IMAGE_TAG: ${{ needs.release-gate.outputs.image-tag }}
        run: |
          cd git.environment-variables
          git checkout main
          cd deploy/overlays/production
          kustomize edit set image "bottlenote-admin-dashboard=${REGISTRY}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

      - name: commit and push with retry
        run: |
          cd git.environment-variables
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/production/kustomization.yaml
          git diff --staged --quiet && exit 0
          git commit -m "chore(dashboard): update production image tag to ${{ needs.release-gate.outputs.image-tag }}"
          for i in {1..5}; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((i * 2))
          done
          exit 1
