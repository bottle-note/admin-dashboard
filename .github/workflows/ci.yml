name: ci planet scale

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 릴리즈 파이프라인 스크립트 검증
        run: |
          python3 .github/scripts/test_seal_deployed_source.py
          bash .github/scripts/verify_pipeline_blocks.sh

      # pnpm 버전은 package.json 의 `packageManager` 필드를 따른다
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

    # - name: Lint (placeholder)
    #    run:  echo "TODO: pnpm lint"

      - name: Build
        run: pnpm build
