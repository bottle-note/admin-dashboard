name: release PR deployment

# 표준 릴리즈 전용 게이트. 핫픽스는 hotfix_pr_merged.yml 이 hotfixes/** 네임스페이스에서 소유한다.
on:
  pull_request_target:
    types: [closed]
    branches:
      - 'releases/**'

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  verify-merged-release-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-key: ${{ steps.release.outputs.release-key }}
      source-sha: ${{ steps.release.outputs.source-sha }}
      release-branch: ${{ steps.release.outputs.release-branch }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: verify release PR
        id: release
        shell: bash
        run: |
          set -euo pipefail

          [[ "$PR_BASE_REF" =~ ^releases/([0-9]{4}-[0-9]{2}-[0-9]{2})/([1-9][0-9]*)$ ]] || {
            echo "::error::base ref is not a standard release ref: $PR_BASE_REF"
            exit 1
          }
          release_date="${BASH_REMATCH[1]}"
          sequence="${BASH_REMATCH[2]}"
          release_key="${release_date}/${sequence}"

          # >>> common PR metadata verification (keep byte-identical between release_pr_merged.yml and hotfix_pr_merged.yml)
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::release PR number is invalid: $PR_NUMBER"
            exit 1
          }
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$PR_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::release PR contains an invalid commit SHA"
            exit 1
          }

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          PR_JSON="$pr_json" EXPECTED_NUMBER="$PR_NUMBER" EXPECTED_BASE="$PR_BASE_REF" EXPECTED_HEAD="$PR_HEAD_REF" \
            EXPECTED_HEAD_SHA="$PR_HEAD_SHA" EXPECTED_BASE_SHA="$PR_BASE_SHA" EXPECTED_MERGE_SHA="$PR_MERGE_SHA" \
            REPOSITORY="$REPOSITORY" python3 - <<'PY'
          import json
          import os
          import sys

          pr = json.loads(os.environ['PR_JSON'])
          head = pr.get('head') or {}
          base = pr.get('base') or {}
          errors = []
          if (head.get('repo') or {}).get('full_name') != os.environ['REPOSITORY']:
              errors.append('PR head repository is not this repository')
          if (base.get('repo') or {}).get('full_name') != os.environ['REPOSITORY']:
              errors.append('PR base repository is not this repository')
          if pr.get('number') != int(os.environ['EXPECTED_NUMBER']):
              errors.append('PR number differs from the event')
          if not pr.get('merged'):
              errors.append('PR is not merged')
          if head.get('ref') != os.environ['EXPECTED_HEAD'] or head.get('sha') != os.environ['EXPECTED_HEAD_SHA']:
              errors.append('PR head differs from the event')
          if base.get('ref') != os.environ['EXPECTED_BASE'] or base.get('sha') != os.environ['EXPECTED_BASE_SHA']:
              errors.append('PR base differs from the event')
          if pr.get('merge_commit_sha') != os.environ['EXPECTED_MERGE_SHA']:
              errors.append('PR merge SHA differs from the event')

          if errors:
              for error in errors:
                  print(f'::error::{error}', file=sys.stderr)
              sys.exit(1)
          PY
          # <<< common PR metadata verification

          candidate_sha="$(PR_JSON="$pr_json" EXPECTED_KEY="$release_key" python3 - <<'PY'
          import json
          import os
          import re
          import sys

          body = (json.loads(os.environ['PR_JSON']).get('body') or '')

          def one(name, pattern):
              values = re.findall(rf'<!--\s*{name}:\s*({pattern})\s*-->', body)
              if len(values) != 1:
                  print(f'::error::release PR body {name} marker is missing or invalid', file=sys.stderr)
                  sys.exit(1)
              return values[0]

          candidate_sha = one('release-source-sha', r'[0-9a-f]{40}')
          key = one('release-key', r'[0-9]{4}-[0-9]{2}-[0-9]{2}/[1-9][0-9]*')
          service = one('release-service', r'dashboard')
          if key != os.environ['EXPECTED_KEY'] or service != 'dashboard':
              print('::error::release PR body markers do not match the release target', file=sys.stderr)
              sys.exit(1)

          # releases/** 는 표준 전용이다. 핫픽스 마커가 보이면 잘못된 네임스페이스로 들어온 PR 이므로 거부한다.
          hotfix_markers = ('release-type', 'release-base-key', 'release-base-source-sha')
          if any(re.search(rf'<!--\s*{name}:', body) for name in hotfix_markers):
              print('::error::standard release PR must not contain hotfix markers', file=sys.stderr)
              sys.exit(1)

          print(candidate_sha)
          PY
          )"

          PR_JSON="$pr_json" python3 - <<'PY'
          import json
          import os
          import sys

          pr = json.loads(os.environ['PR_JSON'])
          head = pr.get('head') or {}
          errors = []
          if head.get('ref') != 'main':
              errors.append('standard release PR head must be main')
          if any(pr.get(field) != 0 for field in ('changed_files', 'additions', 'deletions')):
              errors.append('standard release PR must contain no file changes')

          if errors:
              for error in errors:
                  print(f'::error::{error}', file=sys.stderr)
              sys.exit(1)
          PY

          [[ "$candidate_sha" == "$PR_HEAD_SHA" ]] || {
            echo "::error::release source marker must equal the reviewed PR head SHA"
            exit 1
          }

          git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA" "$PR_MERGE_SHA"
          base_tree="$(git show -s --format=%T "$PR_BASE_SHA")"
          candidate_tree="$(git show -s --format=%T "$PR_HEAD_SHA")"
          merge_tree="$(git show -s --format=%T "$PR_MERGE_SHA")"

          release_parent="$(git rev-parse "${PR_HEAD_SHA}^")"
          release_subject="$(git show -s --format=%s "$PR_HEAD_SHA")"
          [[ "$release_parent" == "$PR_BASE_SHA" ]] || {
            echo "::error::release commit parent does not equal the release base SHA"
            exit 1
          }
          [[ "$release_subject" == "release(dashboard): ${release_key}" ]] || {
            echo "::error::release commit subject does not match the release key"
            exit 1
          }
          [[ "$candidate_tree" == "$base_tree" && "$merge_tree" == "$candidate_tree" ]] || {
            echo "::error::standard release PR is not tree-empty"
            exit 1
          }
          source_sha="$candidate_sha"

          {
            echo "release-key=${release_key}"
            echo "source-sha=${source_sha}"
            echo "release-branch=${PR_BASE_REF}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Admin Dashboard release PR verified"
            echo "- Release key: \`${release_key}\`"
            echo "- Release type: \`standard\`"
            echo "- Candidate SHA: \`${candidate_sha}\`"
            echo "- Deployment SHA: \`${source_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-release-applications:
    needs: verify-merged-release-pr
    uses: ./.github/workflows/deploy_release_applications.yml
    with:
      source_sha: ${{ needs.verify-merged-release-pr.outputs.source-sha }}
      release_key: ${{ needs.verify-merged-release-pr.outputs.release-key }}
      release_type: standard
    secrets: inherit

  delete-release-branch:
    needs:
      - verify-merged-release-pr
      - deploy-release-applications
    runs-on: ubuntu-latest
    steps:
      - name: delete one-time release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ needs.verify-merged-release-pr.outputs.release-branch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_BRANCH" == releases/* ]] || {
            echo "::error::refusing to delete a non-release branch: ${RELEASE_BRANCH}"
            exit 1
          }
          encoded_branch="$(RELEASE_BRANCH="$RELEASE_BRANCH" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RELEASE_BRANCH"], safe=""))')"
          gh api -X DELETE "repos/${REPOSITORY}/git/refs/heads/${encoded_branch}"
          echo "[release-pr] deleted release_branch=${RELEASE_BRANCH}"
