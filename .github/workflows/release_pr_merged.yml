name: release PR deployment

on:
  pull_request:
    types: [closed]
    branches:
      - 'releases/**'

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  verify-merged-empty-release-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-key: ${{ steps.release.outputs.release-key }}
      source-sha: ${{ steps.release.outputs.source-sha }}
      release-branch: ${{ steps.release.outputs.release-branch }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: verify release PR
        id: release
        shell: bash
        run: |
          set -euo pipefail

          [[ "$PR_BASE_REF" =~ ^releases/([0-9]{4}-[0-9]{2}-[0-9]{2})/([1-9][0-9]*)$ ]] || {
            echo "::error::base ref is not a release ref: $PR_BASE_REF"
            exit 1
          }
          release_date="${BASH_REMATCH[1]}"
          sequence="${BASH_REMATCH[2]}"
          release_key="${release_date}/${sequence}"
          [[ "$PR_HEAD_REF" == "main" ]] || {
            echo "::error::head ref must exactly match main"
            exit 1
          }
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$PR_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::release PR contains an invalid commit SHA"
            exit 1
          }

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          PR_JSON="$pr_json" EXPECTED_BASE="$PR_BASE_REF" EXPECTED_HEAD_SHA="$PR_HEAD_SHA" \
            EXPECTED_BASE_SHA="$PR_BASE_SHA" EXPECTED_MERGE_SHA="$PR_MERGE_SHA" REPOSITORY="$REPOSITORY" python3 - <<'PY'
          import json
          import os
          import sys

          pr = json.loads(os.environ['PR_JSON'])
          errors = []
          if ((pr.get('head') or {}).get('repo') or {}).get('full_name') != os.environ['REPOSITORY']:
              errors.append('PR head repository is not this repository')
          if ((pr.get('base') or {}).get('repo') or {}).get('full_name') != os.environ['REPOSITORY']:
              errors.append('PR base repository is not this repository')
          if ((pr.get('head') or {}).get('ref')) != 'main':
              errors.append('PR head ref must be main')
          if ((pr.get('head') or {}).get('sha')) != os.environ['EXPECTED_HEAD_SHA']:
              errors.append('PR head SHA differs from the event')
          if ((pr.get('base') or {}).get('ref')) != os.environ['EXPECTED_BASE']:
              errors.append('PR base ref differs from the event')
          if ((pr.get('base') or {}).get('sha')) != os.environ['EXPECTED_BASE_SHA']:
              errors.append('PR base SHA differs from the event')
          if pr.get('merge_commit_sha') != os.environ['EXPECTED_MERGE_SHA']:
              errors.append('PR merge SHA differs from the event')
          if any(pr.get(field) != 0 for field in ('changed_files', 'additions', 'deletions')):
              errors.append('release PR must contain no file changes')
          if errors:
              for error in errors:
                  print(f'::error::{error}', file=sys.stderr)
              sys.exit(1)
          PY

          release_values="$(PR_JSON="$pr_json" EXPECTED_KEY="$release_key" python3 - <<'PY'
          import json
          import os
          import re
          import sys

          body = json.loads(os.environ['PR_JSON']).get('body') or ''
          source = re.findall(r'<!--\s*release-source-sha:([0-9a-f]{40})\s*-->', body)
          key = re.findall(r'<!--\s*release-key:([0-9]{4}-[0-9]{2}-[0-9]{2}/[1-9][0-9]*)\s*-->', body)
          service = re.findall(r'<!--\s*release-service:(dashboard)\s*-->', body)
          if len(source) != 1 or key != [os.environ['EXPECTED_KEY']] or service != ['dashboard']:
              print('::error::release PR body markers are missing or invalid', file=sys.stderr)
              sys.exit(1)
          print(source[0])
          PY
          )"
          source_sha="${release_values//$'\n'/}"
          [[ "$source_sha" == "$PR_HEAD_SHA" ]] || {
            echo "::error::source SHA marker must equal the merged main head SHA"
            exit 1
          }

          git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA" "$PR_MERGE_SHA"
          release_parent="$(git rev-parse "${PR_HEAD_SHA}^")"
          release_subject="$(git show -s --format=%s "$PR_HEAD_SHA")"
          base_tree="$(git show -s --format=%T "$PR_BASE_SHA")"
          source_tree="$(git show -s --format=%T "$PR_HEAD_SHA")"
          merge_tree="$(git show -s --format=%T "$PR_MERGE_SHA")"
          [[ "$release_parent" == "$PR_BASE_SHA" ]] || {
            echo "::error::release commit parent does not equal the release base SHA"
            exit 1
          }
          [[ "$release_subject" == "release(dashboard): ${release_key}" ]] || {
            echo "::error::release commit subject does not match the release key"
            exit 1
          }
          [[ "$source_tree" == "$base_tree" && "$merge_tree" == "$source_tree" ]] || {
            echo "::error::release PR is not tree-empty"
            exit 1
          }

          {
            echo "release-key=${release_key}"
            echo "source-sha=${source_sha}"
            echo "release-branch=${PR_BASE_REF}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Admin Dashboard release PR verified"
            echo "- Release key: \`${release_key}\`"
            echo "- Source SHA: \`${source_sha}\`"
            echo "- Changed files: \`0\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-release-applications:
    needs: verify-merged-empty-release-pr
    uses: ./.github/workflows/deploy_release_applications.yml
    with:
      source_sha: ${{ needs.verify-merged-empty-release-pr.outputs.source-sha }}
      release_key: ${{ needs.verify-merged-empty-release-pr.outputs.release-key }}
    secrets: inherit

  delete-release-branch:
    needs:
      - verify-merged-empty-release-pr
      - deploy-release-applications
    runs-on: ubuntu-latest
    steps:
      - name: delete one-time release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ needs.verify-merged-empty-release-pr.outputs.release-branch }}
        run: |
          set -euo pipefail
          encoded_branch="$(RELEASE_BRANCH="$RELEASE_BRANCH" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RELEASE_BRANCH"], safe=""))')"
          gh api -X DELETE "repos/${REPOSITORY}/git/refs/heads/${encoded_branch}"
          echo "[release-pr] deleted release_branch=${RELEASE_BRANCH}"
